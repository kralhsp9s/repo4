<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunucu & Bot Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root[data-theme="light"] {
            --bg-color: #f4f4f5;
            --text-color: #18181b;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --border: #e4e4e7;
            --primary: #3b82f6;
            --secondary: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        :root[data-theme="dark"] {
            --bg-color: #18181b;
            --text-color: #f4f4f5;
            --nav-bg: #27272a;
            --card-bg: #27272a;
            --border: #3f3f46;
            --primary: #60a5fa;
            --secondary: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--nav-bg);
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
        }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .server-icon { width: 40px; height: 40px; border-radius: 8px; }
        .server-name { font-size: 1.2rem; font-weight: bold; }
        .nav-right { display: flex; align-items: center; gap: 15px; position: relative; }
        
        /* Butonlar */
        button {
            background-color: var(--primary); color: white;
            border: none; padding: 8px 12px; border-radius: 5px;
            cursor: pointer; font-weight: bold; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        .btn-warning { background-color: var(--warning); color: #000; }
        .hamburger { font-size: 1.5rem; cursor: pointer; background: none; border: none; color: var(--text-color); }

        /* Dropdown Menü */
        .dropdown {
            display: none; position: absolute; top: 100%; right: 0;
            background-color: var(--card-bg); border: 1px solid var(--border);
            padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 10px; width: 200px; z-index: 100;
        }
        .dropdown input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border); }

        /* Container ve Kartlar */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 8px; }
        
        /* Admin Paneli */
        #admin-panel { display: none; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chat-box { height: 350px; overflow-y: auto; background: var(--bg-color); padding: 10px; border: 1px solid var(--border); margin-bottom: 10px; border-radius: 5px;}
        iframe { width: 100%; height: 350px; border: none; border-radius: 8px; background: #000; }
        input[type="text"] { padding: 8px; width: 70%; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-color); border-radius: 4px; }
        
        /* Yeni: Durum Barları ve Etiketler */
        .progress-container { width: 100%; background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; height: 18px; overflow: hidden; margin-top: 5px; }
        .progress-bar { height: 100%; transition: width 0.3s ease; }
        .bg-red { background-color: var(--danger); }
        .bg-orange { background-color: var(--warning); }
        .effect-badge { display: inline-block; background-color: #8b5cf6; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; margin-right: 5px; margin-top: 5px; font-weight: bold;}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="" alt="Simge" id="nav-icon" class="server-icon" style="display:none;">
            <div class="server-name" id="nav-servername">Sunucu Yükleniyor...</div>
        </div>
        <div class="nav-right">
            <button onclick="toggleTheme()">🌓 Tema</button>
            <button class="hamburger" onclick="toggleDropdown()">☰</button>
            
            <div class="dropdown" id="login-dropdown">
                <h4 style="margin-top:0;">Admin Girişi</h4>
                <input type="text" id="username" placeholder="Kullanıcı Adı">
                <input type="password" id="password" placeholder="Şifre">
                <button onclick="login()" style="width:100%">Giriş Yap</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card" id="public-info">
            <h2>Sunucu Durumu</h2>
            <p><strong>Durum:</strong> <span id="status">Sorgulanıyor...</span></p>
            <p><strong>Aktiflik:</strong> <span id="uptime">0</span> dakikadır bot aktif</p>
            <p><strong>Oyuncular:</strong> <span id="player-count">0/0</span></p>
            <p><strong>Çevrimiçi Olanlar:</strong> <span id="player-list">-</span></p>
        </div>

        <div id="admin-panel">
            <div class="card" style="margin-bottom: 20px; border-color: var(--primary); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                <div>
                    <h2 style="margin: 0 0 10px 0;">🛠️ Admin Yönetim Paneli</h2>
                    <button onclick="getLocation()">📍 Bot Konumunu Al</button>
                    <span id="bot-location" style="margin-left: 10px; font-weight: bold;"></span>
                </div>
                <div>
                    <a href="/console" target="_blank" style="text-decoration: none;">
                        <button class="btn-warning" style="font-size: 1.1rem; padding: 10px 20px;">🚀 Gelişmiş Eval Konsolunu Aç</button>
