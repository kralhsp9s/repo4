<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunucu & Bot Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root[data-theme="light"] {
            --bg-color: #f4f4f5;
            --text-color: #18181b;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --border: #e4e4e7;
            --primary: #3b82f6;
        }
        :root[data-theme="dark"] {
            --bg-color: #18181b;
            --text-color: #f4f4f5;
            --nav-bg: #27272a;
            --card-bg: #27272a;
            --border: #3f3f46;
            --primary: #60a5fa;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--nav-bg);
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
        }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .server-icon { width: 40px; height: 40px; border-radius: 8px; }
        .server-name { font-size: 1.2rem; font-weight: bold; }
        .nav-right { display: flex; align-items: center; gap: 15px; position: relative; }
        
        /* Butonlar */
        button {
            background-color: var(--primary); color: white;
            border: none; padding: 8px 12px; border-radius: 5px;
            cursor: pointer; font-weight: bold;
        }
        button:hover { opacity: 0.8; }
        .hamburger { font-size: 1.5rem; cursor: pointer; background: none; border: none; color: var(--text-color); }

        /* Dropdown Menü (Admin Girişi) */
        .dropdown {
            display: none; position: absolute; top: 100%; right: 0;
            background-color: var(--card-bg); border: 1px solid var(--border);
            padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 10px; width: 200px; z-index: 100;
        }
        .dropdown input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }

        /* Container ve Kartlar */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 8px; }
        
        /* Admin Paneli Gizli Başlar */
        #admin-panel { display: none; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chat-box { height: 200px; overflow-y: auto; background: var(--bg-color); padding: 10px; border: 1px solid var(--border); margin-bottom: 10px;}
        iframe { width: 100%; height: 400px; border: none; border-radius: 8px; }
        input[type="text"] { padding: 8px; width: 70%; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-color); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="" alt="Simge" id="nav-icon" class="server-icon" style="display:none;">
            <div class="server-name" id="nav-servername">Sunucu Yükleniyor...</div>
        </div>
        <div class="nav-right">
            <button onclick="toggleTheme()">🌓 Tema</button>
            <button class="hamburger" onclick="toggleDropdown()">☰</button>
            
            <div class="dropdown" id="login-dropdown">
                <h4 style="margin-top:0;">Admin Girişi</h4>
                <input type="text" id="username" placeholder="Kullanıcı Adı">
                <input type="password" id="password" placeholder="Şifre">
                <button onclick="login()" style="width:100%">Giriş Yap</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card" id="public-info">
            <h2>Sunucu Durumu</h2>
            <p><strong>Durum:</strong> <span id="status">Sorgulanıyor...</span></p>
            <p><strong>Aktiflik:</strong> <span id="uptime">0</span> dakikadır bot aktif</p>
            <p><strong>Oyuncular:</strong> <span id="player-count">0/0</span></p>
            <p><strong>Çevrimiçi Olanlar:</strong> <span id="player-list">-</span></p>
        </div>

        <div id="admin-panel">
            <div class="card" style="margin-bottom: 20px; border-color: var(--primary);">
                <h2>🛠️ Admin Yönetim Paneli</h2>
                <button onclick="getLocation()">📍 Bot Konumunu Al</button>
                <span id="bot-location" style="margin-left: 10px; font-weight: bold;"></span>
            </div>

            <div class="grid-2">
                <div>
                    <div class="card" style="margin-bottom: 20px;">
                        <h3>🗺️ Canlı Harita</h3>
                        <iframe src="http://localhost:3001"></iframe>
                    </div>
                    
                    <div class="card">
                        <h3>⚠️ Eval (Kod Deneme)</h3>
                        <input type="text" id="eval-input" placeholder="bot.setControlState('forward', true)">
                        <button onclick="sendEval()">Çalıştır</button>
                        <p id="eval-result" style="font-family: monospace; color: #ef4444; margin-top: 10px;"></p>
                    </div>
                </div>

                <div class="card">
                    <h3>💬 Chat Log</h3>
                    <div class="chat-box" id="chat-box"></div>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="chat-input" placeholder="Oyuna mesaj gönder...">
                        <button onclick="sendChat()" style="width: 30%;">Gönder</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        // --- TEMA İŞLEMLERİ ---
        function toggleTheme() {
            const html = document.documentElement;
            const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }
        if(localStorage.getItem('theme')) {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('theme'));
        }

        // --- UI İŞLEMLERİ ---
        function toggleDropdown() {
            const dropdown = document.getElementById('login-dropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        // --- SUNUCU BİLGİLERİNİ ÇEKME ---
        async function loadServerInfo() {
            const res = await fetch('/api/server-info');
            const data = await res.json();
            
            if(data.online) {
                document.getElementById('status').innerText = '🟢 Aktif';
                document.getElementById('status').style.color = '#22c55e';
                document.getElementById('player-count').innerText = `${data.players}/${data.maxPlayers}`;
                document.getElementById('uptime').innerText = data.uptime;
                document.getElementById('nav-servername').innerText = data.motd || "Minecraft Sunucusu";
                
                if(data.samplePlayers && data.samplePlayers.length > 0) {
                    document.getElementById('player-list').innerText = data.samplePlayers.map(p => p.name).join(', ');
                } else {
                    document.getElementById('player-list').innerText = 'Kimse yok';
                }

                if(data.favicon) {
                    const icon = document.getElementById('nav-icon');
                    icon.src = data.favicon;
                    icon.style.display = 'block';
                }
            } else {
                document.getElementById('status').innerText = '🔴 Kapalı';
                document.getElementById('status').style.color = '#ef4444';
            }
        }
        loadServerInfo();
        setInterval(loadServerInfo, 30000); // 30 saniyede bir güncelle

        // --- ADMİN GİRİŞİ ---
        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            
            if(data.success) {
                alert('Giriş Başarılı!');
                document.getElementById('login-dropdown').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                alert('Hatalı kullanıcı adı veya şifre!');
            }
        }

        // Sayfa yenilendiğinde oturum açık kalmışsa admin panelini göster
        fetch('/api/check-auth').then(r => r.json()).then(data => {
            if(data.isAdmin) document.getElementById('admin-panel').style.display = 'block';
        });

        // --- SOCKET.IO ADMİN AKSİYONLARI ---
        
        // 1. Chat'i Dinleme ve Yazma
        socket.on('chat-log', (data) => {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div style="margin-bottom:5px;"><strong>${data.username}:</strong> ${data.message}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        function sendChat() {
            const msg = document.getElementById('chat-input').value;
            if(!msg) return;
            socket.emit('admin-action', { action: 'send-message', message: msg });
            document.getElementById('chat-input').value = '';
        }

        // 2. Konum Alma
        function getLocation() {
            socket.emit('admin-action', { action: 'get-location' });
        }
        socket.on('location-result', (loc) => {
            document.getElementById('bot-location').innerText = loc;
        });

        // 3. Eval (Kod çalıştırma)
        function sendEval() {
            const code = document.getElementById('eval-input').value;
            socket.emit('admin-action', { action: 'eval-code', code: code });
        }
        socket.on('eval-result', (res) => {
            document.getElementById('eval-result').innerText = `Sonuç: ${res}`;
        });

    </script>
</body>
</html>
